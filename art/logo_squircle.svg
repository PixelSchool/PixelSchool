    <!-- Tassel -->
    <path fill="url(#tasselGrad)" d="M20.98,9.5 L22.08,9.0 V16.2 C22.08,16.55 21.85,16.8 21.53,16.8 C21.21,16.8 20.98,16.55 20.98,16.2 Z" />
    <!-- Skullcap -->
    <path fill="url(#skullGrad)" d="M5,13.18v2.81c0,0.73 0.4,1.41 1.04,1.76l5,2.73c0.6,0.33 1.32,0.33 1.92,0l5,-2.73c0.64,-0.35 1.04,-1.03 1.04,-1.76v-2.81l-6.04,3.3c-0.6,0.33 -1.32,0.33 -1.92,0L5,13.18z" />
    <!-- Mortarboard -->
    <path fill="url(#capGrad)" d="M11.04,3.52 C11.64,3.20 12.36,3.20 12.96,3.52 L21.39,8.12 C21.85,8.37 22.08,8.68 22.08,9.0 L12.96,14.48 C12.36,14.80 11.64,14.80 11.04,14.48 L2.61,9.88 C1.92,9.50 1.92,8.50 2.61,8.12 Z" />
