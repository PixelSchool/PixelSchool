    <path fill="#FFFFFF" fill-opacity="0.2" d="M11.04,3.52 C11.64,3.20 12.36,3.20 12.96,3.52 L20.5,8.4 L19.8,8.8 L12.0,4.4 L3.6,8.8 L2.61,8.12 Z" />
